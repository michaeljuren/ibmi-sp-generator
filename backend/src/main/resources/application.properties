server.port=8080

# IBM i connection - supply via environment variables, never commit credentials
spring.datasource.url=jdbc:as400://${IBMI_HOST:localhost};naming=sql;errors=full
spring.datasource.username=${IBMI_USER:}
spring.datasource.password=${IBMI_PASSWORD:}
spring.datasource.driver-class-name=com.ibm.as400.access.AS400JDBCDriver
# allow the app to start even if the IBM i is not reachable yet
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.maximum-pool-size=3

# allow the Angular dev server
app.cors.allowed-origins=http://localhost:4200
